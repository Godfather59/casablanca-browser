[package]
name = "app"
version = "0.2.0"
description = "A lightweight desktop browser built with Tauri"
authors = ["Godfather59"]
repository = "https://github.com/Godfather59/casablanca-browser"
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["unstable"] }
tauri-plugin-log = "2"
uuid = { version = "1", features = ["v4"] }
